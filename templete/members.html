<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Members – FitZone</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">FZ</div><span>FitZone</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html"      class="nav-link"><span class="nav-icon">⬛</span><span class="nav-label">Dashboard</span></a>
      <a href="members.html"    class="nav-link active"><span class="nav-icon">👤</span><span class="nav-label">Members</span></a>
      <a href="trainers.html"   class="nav-link"><span class="nav-icon">💪</span><span class="nav-label">Trainers</span></a>
      <a href="classes.html"    class="nav-link"><span class="nav-icon">🏋</span><span class="nav-label">Classes</span></a>
      <a href="payments.html"   class="nav-link"><span class="nav-icon">💳</span><span class="nav-label">Payments</span></a>
      <a href="attendance.html" class="nav-link"><span class="nav-icon">📋</span><span class="nav-label">Attendance</span></a>
      <a href="equipment.html"  class="nav-link"><span class="nav-icon">🔧</span><span class="nav-label">Equipment</span></a>
      <a href="reports.html"    class="nav-link"><span class="nav-icon">📊</span><span class="nav-label">Reports</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-profile"><div class="user-avatar">AD</div><div class="user-info"><span class="user-name">Admin</span><span class="user-role">Super Admin</span></div></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="page-title"><h1>Members</h1><span class="breadcrumb">Home / Members</span></div>
      </div>
      <div class="topbar-right">
        <div class="date-display" id="currentDate"></div>
      </div>
    </header>

    <div class="page-body">
      <div class="page-header">
        <h2>All Members</h2>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Member</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search by name or email..." style="flex:1;min-width:200px" oninput="renderTable()"/>
        <select id="planFilter" onchange="renderTable()">
          <option value="">All Plans</option>
          <option>Basic</option><option>Premium</option><option>Elite</option>
        </select>
        <select id="statusFilter" onchange="renderTable()">
          <option value="">All Status</option>
          <option>Active</option><option>Expired</option><option>Pending</option>
        </select>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <table class="data-table" id="membersTable">
          <thead>
            <tr>
              <th>#</th><th>Name</th><th>Phone</th><th>Plan</th>
              <th>Trainer</th><th>Joined</th><th>Expires</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="membersBody"></tbody>
        </table>
      </div>
      <div id="noResults" style="display:none;text-align:center;color:var(--text3);padding:40px">No members found.</div>
    </div>
  </main>

  <!-- ADD/EDIT MODAL -->
  <div class="modal-overlay" id="memberModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Member</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <input type="hidden" id="memberId"/>
      <div class="form-row">
        <div class="form-group"><label>Full Name *</label><input id="mName" type="text" placeholder="e.g. Arjun Sharma"/></div>
        <div class="form-group"><label>Phone *</label><input id="mPhone" type="tel" placeholder="10-digit number"/></div>
      </div>
      <div class="form-group"><label>Email</label><input id="mEmail" type="email" placeholder="email@example.com"/></div>
      <div class="form-row">
        <div class="form-group"><label>Membership Plan *</label>
          <select id="mPlan">
            <option>Basic</option><option>Premium</option><option>Elite</option>
          </select>
        </div>
        <div class="form-group"><label>Status</label>
          <select id="mStatus">
            <option>Active</option><option>Pending</option><option>Expired</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Join Date</label><input id="mJoined" type="date"/></div>
        <div class="form-group"><label>Expiry Date</label><input id="mExpires" type="date"/></div>
      </div>
      <div class="form-group"><label>Assign Trainer</label>
        <select id="mTrainer"><option value="">-- Select Trainer --</option></select>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveMember()">Save Member</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
