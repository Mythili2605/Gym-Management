<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trainers – FitZone</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">FZ</div><span>FitZone</span></div>
    <nav class="sidebar-nav">
      <a href="index.html"      class="nav-link"><span class="nav-icon">⬛</span><span class="nav-label">Dashboard</span></a>
      <a href="members.html"    class="nav-link"><span class="nav-icon">👤</span><span class="nav-label">Members</span></a>
      <a href="trainers.html"   class="nav-link active"><span class="nav-icon">💪</span><span class="nav-label">Trainers</span></a>
      <a href="classes.html"    class="nav-link"><span class="nav-icon">🏋</span><span class="nav-label">Classes</span></a>
      <a href="payments.html"   class="nav-link"><span class="nav-icon">💳</span><span class="nav-label">Payments</span></a>
      <a href="attendance.html" class="nav-link"><span class="nav-icon">📋</span><span class="nav-label">Attendance</span></a>
      <a href="equipment.html"  class="nav-link"><span class="nav-icon">🔧</span><span class="nav-label">Equipment</span></a>
      <a href="reports.html"    class="nav-link"><span class="nav-icon">📊</span><span class="nav-label">Reports</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-profile"><div class="user-avatar">AD</div><div class="user-info"><span class="user-name">Admin</span><span class="user-role">Super Admin</span></div></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="page-title"><h1>Trainers</h1><span class="breadcrumb">Home / Trainers</span></div>
      </div>
    </header>

    <div class="page-body">
      <div class="page-header">
        <h2>Trainer Roster</h2>
        <button class="btn btn-primary" onclick="openModal()">+ Add Trainer</button>
      </div>

      <div id="trainerGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px"></div>
    </div>
  </main>

  <!-- MODAL -->
  <div class="modal-overlay" id="trainerModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="tModalTitle">Add Trainer</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <input type="hidden" id="tId"/>
      <div class="form-row">
        <div class="form-group"><label>Full Name *</label><input id="tName" type="text"/></div>
        <div class="form-group"><label>Phone *</label><input id="tPhone" type="tel"/></div>
      </div>
      <div class="form-group"><label>Email</label><input id="tEmail" type="email"/></div>
      <div class="form-row">
        <div class="form-group"><label>Specialty *</label><input id="tSpec" type="text" placeholder="e.g. Strength Training"/></div>
        <div class="form-group"><label>Experience</label><input id="tExp" type="text" placeholder="e.g. 5 years"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Salary (₹)</label><input id="tSalary" type="number"/></div>
        <div class="form-group"><label>Status</label>
          <select id="tStatus"><option>Active</option><option>On Leave</option><option>Inactive</option></select>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTrainer()">Save</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderTrainers);

    function renderTrainers() {
      const grid = document.getElementById('trainerGrid');
      const trainers = getTrainers();
      const colors = ['--blue','--green','--amber','--coral','--purple','--teal','--accent','--coral'];

      grid.innerHTML = trainers.map((t, i) => `
        <div class="card" style="border-top:3px solid var(${colors[i % colors.length]})">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
            <div style="width:52px;height:52px;border-radius:50%;background:var(${colors[i % colors.length]})20;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(${colors[i % colors.length]});flex-shrink:0">
              ${t.name.split(' ').map(w=>w[0]).join('').substring(0,2)}
            </div>
            <div>
              <div style="font-weight:600;font-size:15px;color:var(--text)">${t.name}</div>
              <div style="font-size:12px;color:var(--text3)">${t.specialty}</div>
            </div>
            <span class="badge ${t.status === 'Active' ? 'badge-active' : 'badge-pending'}" style="margin-left:auto">${t.status}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:14px">
            <div><span style="color:var(--text3)">Experience</span><br/><span style="color:var(--text)">${t.experience}</span></div>
            <div><span style="color:var(--text3)">Members</span><br/><span style="color:var(--text)">${t.members}</span></div>
            <div><span style="color:var(--text3)">Salary</span><br/><span style="color:var(--green)">₹${t.salary.toLocaleString('en-IN')}</span></div>
            <div><span style="color:var(--text3)">Phone</span><br/><span style="color:var(--text)">${t.phone}</span></div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm btn-outline" style="flex:1" onclick="editTrainer(${t.id})">✏ Edit</button>
            <button class="btn btn-sm" style="background:var(--coral)20;color:var(--coral);border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px" onclick="deleteTrainer(${t.id})">🗑</button>
          </div>
        </div>
      `).join('');
    }

    function openModal() {
      document.getElementById('tModalTitle').textContent = 'Add Trainer';
      ['tId','tName','tPhone','tEmail','tSpec','tExp','tSalary'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('tStatus').value = 'Active';
      document.getElementById('trainerModal').classList.add('active');
    }

    function editTrainer(id) {
      const t = getTrainers().find(x => x.id === id);
      if (!t) return;
      document.getElementById('tModalTitle').textContent = 'Edit Trainer';
      document.getElementById('tId').value     = t.id;
      document.getElementById('tName').value   = t.name;
      document.getElementById('tPhone').value  = t.phone;
      document.getElementById('tEmail').value  = t.email;
      document.getElementById('tSpec').value   = t.specialty;
      document.getElementById('tExp').value    = t.experience;
      document.getElementById('tSalary').value = t.salary;
      document.getElementById('tStatus').value = t.status;
      document.getElementById('trainerModal').classList.add('active');
    }

    function saveTrainer() {
      const name = document.getElementById('tName').value.trim();
      if (!name) { alert('Name is required!'); return; }
      const trainers = getTrainers();
      const id = document.getElementById('tId').value;
      const obj = {
        name,
        phone:      document.getElementById('tPhone').value,
        email:      document.getElementById('tEmail').value,
        specialty:  document.getElementById('tSpec').value,
        experience: document.getElementById('tExp').value,
        salary:    +document.getElementById('tSalary').value || 0,
        status:     document.getElementById('tStatus').value,
        members: 0,
      };
      if (id) {
        const idx = trainers.findIndex(t => t.id == id);
        if (idx > -1) trainers[idx] = { ...trainers[idx], ...obj };
      } else {
        trainers.push({ id: nextId(trainers), ...obj });
      }
      saveTrainers(trainers);
      closeModal();
      renderTrainers();
    }

    function deleteTrainer(id) {
      if (!confirm('Delete this trainer?')) return;
      saveTrainers(getTrainers().filter(t => t.id !== id));
      renderTrainers();
    }

    function closeModal() { document.getElementById('trainerModal').classList.remove('active'); }
  </script>
</body>
</html>
