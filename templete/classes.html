<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classes – FitZone</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">FZ</div><span>FitZone</span></div>
    <nav class="sidebar-nav">
      <a href="index.html"      class="nav-link"><span class="nav-icon">⬛</span><span class="nav-label">Dashboard</span></a>
      <a href="members.html"    class="nav-link"><span class="nav-icon">👤</span><span class="nav-label">Members</span></a>
      <a href="trainers.html"   class="nav-link"><span class="nav-icon">💪</span><span class="nav-label">Trainers</span></a>
      <a href="classes.html"    class="nav-link active"><span class="nav-icon">🏋</span><span class="nav-label">Classes</span></a>
      <a href="payments.html"   class="nav-link"><span class="nav-icon">💳</span><span class="nav-label">Payments</span></a>
      <a href="attendance.html" class="nav-link"><span class="nav-icon">📋</span><span class="nav-label">Attendance</span></a>
      <a href="equipment.html"  class="nav-link"><span class="nav-icon">🔧</span><span class="nav-label">Equipment</span></a>
      <a href="reports.html"    class="nav-link"><span class="nav-icon">📊</span><span class="nav-label">Reports</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-profile"><div class="user-avatar">AD</div><div class="user-info"><span class="user-name">Admin</span><span class="user-role">Super Admin</span></div></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="page-title"><h1>Classes</h1><span class="breadcrumb">Home / Classes</span></div>
      </div>
    </header>

    <div class="page-body">
      <div class="page-header">
        <h2>Class Schedule</h2>
        <button class="btn btn-primary" onclick="openModal()">+ Add Class</button>
      </div>
      <div id="classGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px"></div>
    </div>
  </main>

  <div class="modal-overlay" id="classModal">
    <div class="modal">
      <div class="modal-header"><h3>Add Class</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="form-group"><label>Class Name *</label><input id="cName" type="text" placeholder="e.g. Morning Yoga"/></div>
      <div class="form-row">
        <div class="form-group"><label>Time</label><input id="cTime" type="text" placeholder="06:00 AM"/></div>
        <div class="form-group"><label>Duration (min)</label><input id="cDuration" type="number" value="60"/></div>
      </div>
      <div class="form-group"><label>Trainer</label>
        <select id="cTrainer"><option value="">-- Select --</option></select>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Capacity</label><input id="cCapacity" type="number" value="15"/></div>
        <div class="form-group"><label>Category</label>
          <select id="cCategory"><option>Yoga</option><option>Cardio</option><option>Strength</option><option>Dance</option><option>CrossFit</option><option>Pilates</option><option>Functional</option></select>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveClass()">Save Class</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    const catColors = { Yoga:'--teal', Cardio:'--coral', Strength:'--blue', Dance:'--purple', CrossFit:'--amber', Pilates:'--green', Functional:'--accent' };

    document.addEventListener('DOMContentLoaded', () => {
      renderClasses();
      getTrainers().forEach(t => {
        const o = document.createElement('option');
        o.value = t.name; o.textContent = t.name;
        document.getElementById('cTrainer').appendChild(o);
      });
    });

    function renderClasses() {
      const grid = document.getElementById('classGrid');
      grid.innerHTML = getClasses().map(c => {
        const color = catColors[c.category] || '--accent';
        const pct   = Math.round((c.enrolled / c.capacity) * 100);
        return `
          <div class="card" style="border-top:3px solid var(${color})">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
              <div>
                <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:var(--text)">${c.name}</div>
                <div style="font-size:12px;color:var(--text3)">${c.category}</div>
              </div>
              <span style="background:var(${color})20;color:var(${color});font-size:11px;padding:3px 10px;border-radius:20px">${c.time}</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:14px">
              <div><span style="color:var(--text3)">Trainer</span><br/><span style="color:var(--text)">${c.trainer}</span></div>
              <div><span style="color:var(--text3)">Duration</span><br/><span style="color:var(--text)">${c.duration} min</span></div>
              <div><span style="color:var(--text3)">Days</span><br/><span style="color:var(--text)">${c.days}</span></div>
              <div><span style="color:var(--text3)">Enrolled</span><br/><span style="color:var(--green)">${c.enrolled}/${c.capacity}</span></div>
            </div>
            <div style="height:6px;background:var(--surface2);border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:var(${color});border-radius:3px"></div>
            </div>
            <div style="font-size:11px;color:var(--text3);margin-top:4px">${pct}% capacity</div>
          </div>
        `;
      }).join('');
    }

    function openModal()  { document.getElementById('classModal').classList.add('active'); }
    function closeModal() { document.getElementById('classModal').classList.remove('active'); }

    function saveClass() {
      const name = document.getElementById('cName').value.trim();
      if (!name) { alert('Class name required!'); return; }
      const classes = getClasses();
      classes.push({
        id:       nextId(classes),
        name,
        trainer:  document.getElementById('cTrainer').value,
        time:     document.getElementById('cTime').value,
        duration: +document.getElementById('cDuration').value,
        capacity: +document.getElementById('cCapacity').value,
        category: document.getElementById('cCategory').value,
        enrolled: 0,
        days: 'Mon,Wed,Fri'
      });
      saveClasses(classes);
      closeModal();
      renderClasses();
    }
  </script>
</body>
</html>
